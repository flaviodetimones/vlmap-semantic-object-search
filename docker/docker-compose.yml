services:

  # ── Container 1: core simulation & AI stack ───────────────────────────────
  tfg-sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: tfg-sim:latest
    container_name: tfg-sim
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - ../../data:/workspace/data
      - ../results:/workspace/results
      - ../../vlmaps/vlmaps/lseg/checkpoints:/workspace/third_party/vlmaps/vlmaps/lseg/checkpoints
      - ../../shared:/shared
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
    ports:
      - "8888:8888"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_KEY=${OPENAI_API_KEY}
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/root/.Xauthority
    stdin_open: true
    tty: true
    shm_size: "16gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - tfg-net

  # ── Container 2: ROS 1 Noetic + Gazebo Classic (Sprint 1 scaffolding) ────
  # Holds the ROS navigation stack only; tfg-sim keeps Habitat-Sim and
  # the heavy ML deps. The two containers communicate over the tfg-net
  # docker network via rosbridge (port 9090) once Sprint 2 wires it.
  tfg-ros:
    build:
      context: .
      dockerfile: Dockerfile.ros
    image: tfg-ros:latest
    container_name: tfg-ros
    working_dir: /ros_ws
    volumes:
      - ../ros_ws:/ros_ws
      - ..:/workspace
      - ../../shared:/shared
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/root/.Xauthority
      - ROS_MASTER_URI=http://tfg-ros:11311
      - ROS_HOSTNAME=tfg-ros
      - ROS_MODE=${ROS_MODE:-shell}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics,utility,compute
    ports:
      - "9090:9090"
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - tfg-net

networks:
  tfg-net:
    driver: bridge
