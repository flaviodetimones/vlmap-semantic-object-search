# move_base defaults for Toyota HSR simulation.
#
# This file is intentionally separate from move_base_params.yaml. The existing
# simple_diffbot launch remains the cheap smoke test; this profile assumes an
# HSR-like base footprint, base_footprint TF frame and the HSR base laser topic.

base_global_planner: navfn/NavfnROS
base_local_planner: dwa_local_planner/DWAPlannerROS
controller_frequency: 8.0
planner_frequency: 0.25
recovery_behavior_enabled: false
clearing_rotation_allowed: false
shutdown_costmaps: false
footprint: [[0.34, 0.28], [0.34, -0.28], [-0.34, -0.28], [-0.34, 0.28]]

global_costmap:
  global_frame: map
  robot_base_frame: base_footprint
  update_frequency: 1.0
  publish_frequency: 0.5
  transform_tolerance: 0.5
  static_map: true
  rolling_window: false
  track_unknown_space: false
  plugins:
    - {name: static_layer, type: "costmap_2d::StaticLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  static_layer:
    map_topic: /map
    subscribe_to_updates: false
  inflation_radius: 0.65
  inflation_layer:
    inflation_radius: 0.65

local_costmap:
  global_frame: odom
  robot_base_frame: base_footprint
  update_frequency: 5.0
  publish_frequency: 2.0
  transform_tolerance: 0.5
  static_map: false
  rolling_window: true
  width: 5.0
  height: 5.0
  resolution: 0.05
  track_unknown_space: false
  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  obstacle_layer:
    obstacle_range: 3.0
    raytrace_range: 4.0
    observation_sources: hsr_base_scan
    hsr_base_scan:
      data_type: LaserScan
      topic: /hsrb/base_scan
      marking: true
      clearing: true
      inf_is_valid: true
  inflation_radius: 0.55
  inflation_layer:
    inflation_radius: 0.55

DWAPlannerROS:
  meter_scoring: true
  acc_lim_x: 0.35
  acc_lim_y: 0.0
  acc_lim_theta: 1.00
  max_vel_x: 0.25
  min_vel_x: 0.0
  max_vel_theta: 0.60
  min_vel_theta: -0.60
  min_in_place_vel_theta: 0.25
  holonomic_robot: false
  yaw_goal_tolerance: 0.45
  xy_goal_tolerance: 0.35
  latch_xy_goal_tolerance: true
  sim_time: 2.5
  sim_granularity: 0.05
  angular_sim_granularity: 0.10
  vx_samples: 6
  vtheta_samples: 12
  path_distance_bias: 36.0
  goal_distance_bias: 24.0
  occdist_scale: 0.08
  forward_point_distance: 0.20
  stop_time_buffer: 0.4
  oscillation_reset_dist: 0.25
  oscillation_reset_angle: 0.35
