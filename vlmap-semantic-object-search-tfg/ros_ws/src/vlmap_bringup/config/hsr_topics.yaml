# Topic/frame contract expected by the VLMap ROS stack when running with HSR.
#
# The launch file loads this under /vlmap/hsr. Keeping the contract in YAML
# makes the same names reusable by Gazebo, rosbridge smoke tests and later the
# physical robot bringup.

frames:
  map: map
  odom: odom
  base: base_footprint
  base_link: base_link
  head_rgbd: head_rgbd_sensor_rgb_frame

navigation:
  goal: /move_base_simple/goal
  result: /vlmap/navigation_result
  cmd_vel: /hsrb/command_velocity
  odom: /odom
  base_scan: /hsrb/base_scan

perception:
  rgb_image: /hsrb/head_rgbd_sensor/rgb/image_raw
  depth_image: /hsrb/head_rgbd_sensor/depth_registered/image_raw
  camera_info: /hsrb/head_rgbd_sensor/rgb/camera_info
  point_cloud: /hsrb/head_rgbd_sensor/depth_registered/points

state:
  tf: /tf
  joint_states: /joint_states
